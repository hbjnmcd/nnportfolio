{{ define "content" }}

<div class="home-container">

  {{ if .Content }}
    <div class="home-intro">
      {{ .Content }}
    </div>
  {{ end }}

  <hr class="home-divider">

  <h2 class="section-title">Учебные модули</h2>

  <div class="modules-grid">

    {{ range where site.RegularPages "Section" "modules" }}

      <div class="module-card">
        <details>
          <summary>{{ .Title }}</summary>

          <div class="module-content">
            {{ .Content }}</div>
        </details>
      </div>

    {{ end }}

  </div>

</div>

{{ end }}
